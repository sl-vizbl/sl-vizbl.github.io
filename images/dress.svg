<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe9"/>
      <stop offset="1" stop-color="#efe1d8"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#ecdfc8"/>
    </linearGradient>
    <linearGradient id="skirtShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dac0"/>
      <stop offset="0.5" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e4d5ba"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#bg)"/>
  <circle cx="720" cy="220" r="190" fill="#eadbcf" opacity="0.55"/>
  <circle cx="150" cy="880" r="240" fill="#eadbcf" opacity="0.4"/>

  <!-- floor shadow -->
  <ellipse cx="450" cy="1010" rx="240" ry="26" fill="#d8c6b4" opacity="0.5"/>

  <!-- hanger -->
  <g stroke="#8a7a68" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M450 96 q0 -26 24 -26 q24 0 24 22 q0 18 -24 30 l0 20"/>
    <path d="M450 96 v0"/>
    <path d="M290 208 L450 142 L610 208"/>
  </g>

  <!-- dress -->
  <g>
    <!-- skirt -->
    <path d="M352 470
             C 340 560 300 780 282 950
             C 380 986 520 986 618 950
             C 600 780 560 560 548 470 Z"
          fill="url(#skirtShade)"/>
    <!-- bodice -->
    <path d="M372 190
             C 372 190 412 216 450 216
             C 488 216 528 190 528 190
             L 560 320
             C 560 420 552 450 548 474
             C 480 498 420 498 352 474
             C 348 450 340 420 340 320 Z"
          fill="url(#fabric)"/>
    <!-- wrap neckline -->
    <g stroke="#d9c6a6" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M382 200 C 420 260 440 320 448 400"/>
      <path d="M518 200 C 480 260 460 320 452 400"/>
    </g>
    <!-- short sleeves -->
    <path d="M372 192 C 330 206 306 244 300 292 C 322 306 346 310 364 306 C 362 260 366 224 372 192 Z" fill="#eee2cc"/>
    <path d="M528 192 C 570 206 594 244 600 292 C 578 306 554 310 536 306 C 538 260 534 224 528 192 Z" fill="#eee2cc"/>
    <!-- waist sash -->
    <rect x="348" y="440" width="204" height="42" rx="16" fill="#c98f7e"/>
    <path d="M430 482 C 420 540 404 580 386 610 C 398 618 410 618 420 612 C 436 574 446 534 452 486 Z" fill="#c98f7e" opacity="0.9"/>
    <path d="M470 482 C 478 534 488 570 502 604 C 514 608 524 604 532 596 C 516 560 506 526 500 486 Z" fill="#bd8271" opacity="0.9"/>
    <!-- skirt folds -->
    <g stroke="#dccdae" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M392 520 C 380 660 360 800 344 920"/>
      <path d="M450 530 C 448 670 446 810 446 934"/>
      <path d="M508 520 C 520 660 540 800 556 920"/>
    </g>
    <!-- hem -->
    <path d="M282 950 C 380 986 520 986 618 950" stroke="#d3c1a2" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
